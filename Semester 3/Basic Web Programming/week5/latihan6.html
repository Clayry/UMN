<!doctype html>
<html>
<head>
    <title>Hello World</title>
</head>
<body>
    <script>
        function isPrima(n) {
            if (n <= 1) {
                return false;
            }
            for (let i = 2; i < n; i++) {
                if (n % i === 0) {
                    return false;
                }
            }
            return true;
        }

        let input = window.prompt("Masukkan sebuah angka:");
        let batas = Number(input);

        if (input === null || input.trim() === "" || isNaN(batas) || !Number.isInteger(batas) || batas < 1) {
            document.write("Input tidak valid! Masukkan bilangan bulat >= 1.");
        } else {
            document.write("Bilangan prima dari 1 sampai " + batas + ":<br>");
            for (let i = 1; i <= batas; i++) {
                if (isPrima(i)) {
                    document.write(i + "<br>");
                }
            }
        }
    </script>
</body>
</html>
