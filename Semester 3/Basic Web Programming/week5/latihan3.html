<!doctype html>
<html>
<head>
    <title>Hello World</title>
</head>
<body>
    <script>
        let input = window.prompt("Masukkan Jam Sekarang (0-23):");
        let jam = Number(input);

        if (input === null || input.trim() === "" || isNaN(jam) || !Number.isInteger(jam) || jam < 0 || jam > 23) {
            alert("Input tidak valid! Masukkan jam 0 sampai 23.");
        } else {
            let salam;

            if (jam >= 6 && jam <= 10) {
                salam = "Selamat Pagi";
            } else if (jam >= 11 && jam <= 14) {
                salam = "Selamat Siang";
            } else if (jam >= 15 && jam <= 17) {
                salam = "Selamat Sore";
            } else if (jam >= 18 && jam <= 22) {
                salam = "Selamat Malam";
            } else if (jam >= 23 || jam <= 5) {
                salam = "Selamat Tidur";
            }

            alert(salam);
            document.write("Jam: " + jam + "<br>");
            document.write(salam);
        }
    </script>
</body>
</html>
