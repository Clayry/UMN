                <td>Hobi</td>

                    <label><input type="checkbox" name="hobi" value="makan" /> Makan</label>

            </tr>
            <tr>
                <td>Jenis Kelamin</td>

                    <label><input type="radio" name="kelamin" value="laki-laki" required /> Laki-laki</label>

                    <label><input type="radio" name="kelamin" value="na" /> Tidak Punya</label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><button id="daftar" type="submit">Daftar Jadi Teman</button></td>
            </tr>
